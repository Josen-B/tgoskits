# Vm base info configs
#
[base]
# Guest vm id.
id = 1
# Guest vm name.
name = "linux-asus-nuc15crh"
# Virtualization type.
vm_type = 1
# The number of virtual CPUs.
cpu_num = 1
# Guest vm physical cpu sets.
phys_cpu_sets = [1]

#
# Vm kernel configs
#
[kernel]
# The entry point of the kernel image.
# Linux direct boot uses the Linux-specific boot stub at this GPA.
entry_point = 0x8000
# The location of image: "memory" | "fs".
# The ASUS NUC15CRH HTTP Boot flow embeds the Linux guest image into AxVisor.
image_location = "memory"
# The file path of the Linux kernel image.
# This final rootfs boot path requires a kernel with NVMe built in:
# CONFIG_BLK_DEV_NVME=y and CONFIG_NVME_CORE=y.
kernel_path = "../../tmp/asus-nuc15crh-linux/linux-nvme-minimal"
# The load address of the kernel image.
kernel_load_addr = 0x20_0000
# Whether to enable BIOS boot flow.
enable_bios = false
# Linux kernel command line.
# No ramdisk_path is used here. The guest mounts the prepared NVMe partition
# directly as its root filesystem.
# Do not add console=ttyS0 here. Linux currently detects ttyS0 with irq=0
# unless userspace can reopen it and set IRQ4 before starting the shell.
cmdline = "earlycon=uart8250,io,0x3f8,115200 keep_bootcon root=/dev/nvme0n1p3 rootfstype=ext4 rootwait rw devtmpfs.mount=1 init=/sbin/axinit acpi=off pci=conf1 nvme_core.io_timeout=1 nvme_core.admin_timeout=1"

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
  [0x0000_0000, 0x1800_0000, 0x7, 1], # Identity main RAM 384M; actual GPA follows allocated HPA
  [0x0000_0000, 0x0010_0000, 0x7, 0], # Low x86 boot scratch for fixed boot_params/stub GPA
]

#
# Device specifications
#
[devices]
# The interrupt mode.
interrupt_mode = "passthrough"

# Emu_devices.
# Name Base-Ipa Ipa_len Alloc-Irq Emu-Type EmuConfig.
emu_devices = [
  ["x86-com1", 0x3f8, 0x8, 0x0, 0x2, []],
  ["x86-ioapic", 0xfec0_0000, 0x1000, 0x0, 0x23, []],
  ["x86-pit", 0x40, 0x22, 0x0, 0x24, []],
]

# Pass-through devices.
# Name Base-Ipa Base-Pa Length Alloc-Irq.
passthrough_devices = [
  [
    "HPET",
    0xfed0_0000,
    0xfed0_0000,
    0x1000,
    0x1,
  ],
  [
    "pci-intx:bus=1,dev=0,func=0,pin=1,root_dev=1,root_func=0,root_pin=1,msi_start=0x20,msi_end=0xfe",
    0x8000_0000,
    0x8000_0000,
    0x4000_0000,
    16,
  ],
]

# Passthrough addresses.
# Base-GPA  Length.
passthrough_addresses = [
  [0xfe00_0000, 0x00c0_0000],
]

# Passthrough x86 I/O ports.
# Base-port Length.
passthrough_ports = [
  [0xcf8, 0x8],
]

# Devices that are not desired to be passed through to the guest
excluded_devices = []

name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "**/docs/**"
      - "**/doc/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "**/docs/**"
      - "**/doc/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: >-
    ${{
      github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
      && format('ci-{0}-{1}', github.workflow, github.ref)
      || format('ci-{0}-{1}', github.workflow, github.run_id)
    }}
  queue: max

jobs:
  test_checks:
    name: Test axloader HTTP smoke
    uses: ./.github/workflows/reusable-command.yml
    with:
      runs_on: '["ubuntu-latest"]'
      use_container: false
      command: |
        rustup target add x86_64-unknown-uefi
        sudo apt-get install -y --no-install-recommends ovmf
        UEFI_FIRMWARE=""
        for candidate in \
          /usr/share/OVMF/OVMF_CODE_4M.fd \
          /usr/share/OVMF/OVMF_CODE.fd \
          /usr/share/ovmf/OVMF.fd \
          /usr/share/qemu/OVMF.fd; do
          if [ -r "${candidate}" ]; then
            UEFI_FIRMWARE="${candidate}"
            break
          fi
        done
        if [ -z "${UEFI_FIRMWARE}" ]; then
          echo "ERROR: OVMF firmware is missing on this runner. Provision it with: sudo apt-get update && sudo apt-get install -y --no-install-recommends ovmf" >&2
          exit 1
        fi
        export AXLOADER_X86_64_UEFI_FIRMWARE="${UEFI_FIRMWARE}"
        cargo axloader test qemu --target x86_64-unknown-uefi
      cache_key: ""
      container_image: ""
      require_kvm: true
      timeout_minutes: 20
    secrets:
      CLAW_API_KEY: ${{ secrets.CLAW_API_KEY }}

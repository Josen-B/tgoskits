name: Perf Dashboard Verify

# Fork-only verification for the nightly performance-history pipeline.
# Feeds real board benchmark data captured from local runs through the exact
# same collect + github-action-benchmark steps used by AxVisor Nightly.
# Do not merge this workflow into the upstream repository.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  seed:
    name: Seed benchmark history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Write captured board benchmark data
        run: |
          mkdir -p "${RUNNER_TEMP}/performance-reports"
          cat > "${RUNNER_TEMP}/performance-reports/captured.json" <<'EOF'
          [
            {"name": "vcpu-perf/blocks_per_second", "unit": "blocks/s", "value": 368008.45},
            {"name": "ivc-bench/send/256KiB", "unit": "MB/s", "value": 2263.10},
            {"name": "ivc-bench/receive/256KiB", "unit": "MB/s", "value": 1505.03},
            {"name": "ivc-bench/send/512KiB", "unit": "MB/s", "value": 2284.72},
            {"name": "ivc-bench/receive/512KiB", "unit": "MB/s", "value": 1959.02},
            {"name": "ivc-bench/send/1MiB", "unit": "MB/s", "value": 2287.42},
            {"name": "ivc-bench/receive/1MiB", "unit": "MB/s", "value": 2045.21},
            {"name": "ivc-bench/send/10MiB", "unit": "MB/s", "value": 2238.97},
            {"name": "ivc-bench/receive/10MiB", "unit": "MB/s", "value": 2074.69}
          ]
          EOF

      - name: Collect benchmark data
        id: collect
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'EOF'
          import json, pathlib, sys
          reports = pathlib.Path(sys.argv[1]) / "performance-reports"
          metrics = [
              metric
              for path in sorted(reports.glob("*.json"))
              for metric in json.loads(path.read_text(encoding="utf-8"))
          ]
          output = pathlib.Path(sys.argv[1]) / "bench.json"
          output.write_text(json.dumps(metrics, indent=2), encoding="utf-8")
          print(f"collected {len(metrics)} metrics")
          EOF
          count=$(python3 -c \
            "import json, os; print(len(json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'bench.json')))))")
          echo "metrics=${count}" >> "$GITHUB_OUTPUT"

      - name: Publish dashboard branch
        if: steps.collect.outputs.metrics != '0'
        env:
          # Distinct revision per dispatch so repeated verification runs on the
          # same day show up as separate points on the date axis.
          NIGHTLY_REVISION: verify-${{ github.run_number }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          dashboard="${RUNNER_TEMP}/dashboard"
          mkdir -p "${dashboard}"
          if git fetch --depth=1 origin perf-data 2>/dev/null; then
            git show FETCH_HEAD:history.json > "${dashboard}/history.json"
          fi
          python3 scripts/test/ci_perf_dashboard.py \
            --metrics "${RUNNER_TEMP}/bench.json" \
            --history "${dashboard}/history.json" \
            --date "$(date -u +%F)" \
            --revision "${NIGHTLY_REVISION}" \
            --title "AxVisor Nightly Benchmarks" \
            --window 7 \
            --output "${dashboard}/index.html"
          html_blob=$(git hash-object -w "${dashboard}/index.html")
          json_blob=$(git hash-object -w "${dashboard}/history.json")
          tree=$(printf '100644 blob %s\tindex.html\n100644 blob %s\thistory.json\n' \
            "${html_blob}" "${json_blob}" | git mktree)
          commit=$(git commit-tree "${tree}" -m "chore: update perf dashboard for $(date -u +%F)")
          git push --force origin "${commit}:refs/heads/perf-data"

      - name: Refresh docs pages
        if: steps.collect.outputs.metrics != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main

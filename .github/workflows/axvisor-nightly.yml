name: AxVisor Nightly

on:
  schedule:
    # 03:20 Beijing time, offset from the Starry Apps schedule.
    - cron: "20 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: axvisor-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Plan AxVisor Nightly
    if: github.repository == 'rcore-os/tgoskits'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      prepare_matrix: ${{ steps.matrix.outputs.prepare_matrix }}
      axvisor_matrix: ${{ steps.matrix.outputs.axvisor_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
      - name: Pin dev revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Plan all registered AxVisor checks
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/test/ci_plan.py \
            --mode axvisor-nightly \
            --repository "$GITHUB_REPOSITORY" \
            --repository-owner "$GITHUB_REPOSITORY_OWNER" \
            --event-name "$EVENT_NAME" \
            --output-file "$GITHUB_OUTPUT"

  prepare:
    name: Prepare
    needs: plan
    uses: ./.github/workflows/reusable-check-matrix.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.revision }}
      matrix_json: ${{ needs.plan.outputs.prepare_matrix }}
      save_cache: ${{ github.event_name == 'schedule' }}

  checks:
    name: AxVisor
    needs: [plan, prepare]
    uses: ./.github/workflows/reusable-check-matrix.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.revision }}
      matrix_json: ${{ needs.plan.outputs.axvisor_matrix }}
      fail_fast: false
      save_cache: ${{ github.event_name == 'schedule' }}

  result:
    name: Nightly Result
    if: always() && github.repository == 'rcore-os/tgoskits'
    needs: [plan, prepare, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Download performance reports
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: axvisor-nightly-performance-*
          path: ${{ runner.temp }}/performance-reports
          merge-multiple: true
        continue-on-error: true

      - name: Report result
        env:
          REVISION: ${{ needs.plan.outputs.revision }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          PERFORMANCE_REPORT_DIR: ${{ runner.temp }}/performance-reports
        run: |
          {
            echo "## AxVisor Nightly"
            echo ""
            echo "dev revision: ${REVISION}"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Plan | ${PLAN_RESULT} |"
            echo "| Prepare | ${PREPARE_RESULT} |"
            echo "| Checks | ${CHECKS_RESULT} |"
            if [ -d "${PERFORMANCE_REPORT_DIR}" ] && find "${PERFORMANCE_REPORT_DIR}" -name '*.md' -print -quit | grep -q .; then
              echo ""
              echo "## Performance Results"
              echo ""
              find "${PERFORMANCE_REPORT_DIR}" -name '*.md' -print | sort | while read -r report; do
                cat "${report}"
                echo ""
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$PLAN_RESULT" = success
          test "$PREPARE_RESULT" = success
          test "$CHECKS_RESULT" = success

  perf-history:
    name: Performance History
    if: always() && github.repository == 'rcore-os/tgoskits'
    needs: [plan, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.revision }}

      - name: Download performance reports
        uses: actions/download-artifact@v8
        with:
          pattern: axvisor-nightly-performance-*
          path: ${{ runner.temp }}/performance-reports
          merge-multiple: true

      - name: Collect benchmark data
        id: collect
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'EOF'
          import json, pathlib, sys
          reports = pathlib.Path(sys.argv[1]) / "performance-reports"
          metrics = [
              metric
              for path in sorted(reports.glob("*.json"))
              for metric in json.loads(path.read_text(encoding="utf-8"))
          ]
          output = pathlib.Path(sys.argv[1]) / "bench.json"
          output.write_text(json.dumps(metrics, indent=2), encoding="utf-8")
          print(f"collected {len(metrics)} metrics")
          EOF
          count=$(python3 -c \
            "import json, os; print(len(json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'bench.json')))))")
          echo "metrics=${count}" >> "$GITHUB_OUTPUT"

      - name: Ensure gh-pages branch exists
        run: |
          set -euo pipefail
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Seed the branch with a root redirect so the site never falls back
          # to rendering a README; the dashboard itself lives in axvisor-perf/.
          redirect=$(mktemp)
          cat > "${redirect}" <<'HTML'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=axvisor-perf/">
              <title>tgoskits performance dashboard</title>
            </head>
            <body>
              <p>Redirecting to the <a href="axvisor-perf/">benchmark dashboard</a>.</p>
            </body>
          </html>
          HTML
          blob=$(git hash-object -w "${redirect}")
          tree=$(printf '100644 blob %s\tindex.html\n' "${blob}" | git mktree)
          commit=$(git commit-tree "${tree}" -m "chore: initialize gh-pages for benchmark history")
          git push origin "${commit}:refs/heads/gh-pages"

      - name: Update benchmark history
        if: steps.collect.outputs.metrics != '0'
        env:
          NIGHTLY_REVISION: ${{ needs.plan.outputs.revision }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add --detach "${RUNNER_TEMP}/gh-pages" FETCH_HEAD
          python3 scripts/test/ci_perf_dashboard.py \
            --metrics "${RUNNER_TEMP}/bench.json" \
            --history "${RUNNER_TEMP}/gh-pages/axvisor-perf/history.json" \
            --date "$(date -u +%F)" \
            --revision "${NIGHTLY_REVISION}" \
            --title "AxVisor Nightly Benchmarks" \
            --output "${RUNNER_TEMP}/gh-pages/axvisor-perf/index.html"
          cd "${RUNNER_TEMP}/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add axvisor-perf
          git commit -m "chore: update axvisor-perf dashboard"
          git push origin HEAD:refs/heads/gh-pages
